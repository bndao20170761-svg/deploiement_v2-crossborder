version: '3.8'

networks:
  pvvih-network:
    driver: bridge

volumes:
  mongodb-data:
  mysql-user-data:
  mysql-reference-data:
  mysql-patient-data:
  maven-repo:

services:
  # ==================== Database Services ====================
  
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-admin123}
      - MONGO_INITDB_DATABASE=forum_db
    volumes:
      - mongodb-data:/data/db
    networks:
      - pvvih-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mysql-user:
    image: mysql:8.0
    container_name: mysql-user
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=user_db
      - MYSQL_USER=user_service
      - MYSQL_PASSWORD=${MYSQL_USER_PASSWORD:-user123}
    volumes:
      - mysql-user-data:/var/lib/mysql
    networks:
      - pvvih-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mysql-reference:
    image: mysql:8.0
    container_name: mysql-reference
    ports:
      - "3308:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=reference_db
      - MYSQL_USER=reference_service
      - MYSQL_PASSWORD=${MYSQL_REFERENCE_PASSWORD:-reference123}
    volumes:
      - mysql-reference-data:/var/lib/mysql
    networks:
      - pvvih-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mysql-patient:
    image: mysql:8.0
    container_name: mysql-patient
    ports:
      - "3309:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=patient_db
      - MYSQL_USER=patient_service
      - MYSQL_PASSWORD=${MYSQL_PATIENT_PASSWORD:-patient123}
    volumes:
      - mysql-patient-data:/var/lib/mysql
    networks:
      - pvvih-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ==================== Edge Services ====================
  
  api-register:
    build:
      context: ./api_register
      dockerfile: Dockerfile
    container_name: api-register
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    volumes:
      - maven-repo:/root/.m2
    networks:
      - pvvih-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  api-configuration:
    build:
      context: ./api_configuration/demo
      dockerfile: Dockerfile
    container_name: api-configuration
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://api-register:8761/eureka/
    volumes:
      - maven-repo:/root/.m2
    networks:
      - pvvih-network
    depends_on:
      api-register:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  gateway-pvvih:
    build:
      context: ./Getway_PVVIH
      dockerfile: Dockerfile
    container_name: gateway-pvvih
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://api-register:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://api-configuration:8888
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - maven-repo:/root/.m2
    networks:
      - pvvih-network
    depends_on:
      api-register:
        condition: service_healthy
      api-configuration:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ==================== Backend Services ====================
  
  forum-pvvih:
    build:
      context: ./Forum_PVVIH
      dockerfile: Dockerfile
    container_name: forum-pvvih
    ports:
      - "9092:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://api-register:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://api-configuration:8888
      - SPRING_DATA_MONGODB_URI=mongodb://admin:${MONGO_PASSWORD:-admin123}@mongodb:27017/forum_db?authSource=admin
      - SPRING_DATA_MONGODB_DATABASE=forum_db
      - SERVER_PORT=8080
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - JWT_SECRET=${JWT_SECRET}
      - APP_JWT_SECRET=${JWT_SECRET}
      - APP_JWT_EXPIRATION=3600000
    volumes:
      - maven-repo:/root/.m2
    networks:
      - pvvih-network
    depends_on:
      mongodb:
        condition: service_healthy
      api-register:
        condition: service_healthy
      api-configuration:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  gestion-user:
    build:
      context: ./gestion_user
      dockerfile: Dockerfile
    container_name: gestion-user
    ports:
      - "9089:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://api-register:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://api-configuration:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-user:3306/user_db
      - SPRING_DATASOURCE_USERNAME=user_service
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_USER_PASSWORD:-user123}
      - SERVER_PORT=8080
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - JWT_SECRET=${JWT_SECRET}
      - APP_JWT_SECRET=${JWT_SECRET}
      - APP_JWT_EXPIRATION=3600000
    volumes:
      - maven-repo:/root/.m2
    networks:
      - pvvih-network
    depends_on:
      mysql-user:
        condition: service_healthy
      api-register:
        condition: service_healthy
      api-configuration:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  gestion-reference:
    build:
      context: ./gestion_reference
      dockerfile: Dockerfile
    container_name: gestion-reference
    ports:
      - "9090:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://api-register:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://api-configuration:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-reference:3306/reference_db
      - SPRING_DATASOURCE_USERNAME=reference_service
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_REFERENCE_PASSWORD:-reference123}
      - APP_JWT_SECRET=${JWT_SECRET}
      - APP_JWT_EXPIRATION=3600000
      - SERVER_PORT=8080
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - maven-repo:/root/.m2
    networks:
      - pvvih-network
    depends_on:
      mysql-reference:
        condition: service_healthy
      api-register:
        condition: service_healthy
      api-configuration:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  gestion-patient:
    build:
      context: ./gestion_patient
      dockerfile: Dockerfile
    container_name: gestion-patient
    ports:
      - "9091:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://api-register:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://api-configuration:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-patient:3306/patient_db
      - SPRING_DATASOURCE_USERNAME=patient_service
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PATIENT_PASSWORD:-patient123}
      - SERVER_PORT=8080
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - JWT_SECRET=${JWT_SECRET}
      - APP_JWT_SECRET=${JWT_SECRET}
      - APP_JWT_EXPIRATION=3600000
    volumes:
      - maven-repo:/root/.m2
    networks:
      - pvvih-network
    depends_on:
      mysql-patient:
        condition: service_healthy
      api-register:
        condition: service_healthy
      api-configuration:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ==================== Nginx Reverse Proxy avec HTTPS ====================
  
  nginx-https:
    image: nginx:alpine
    container_name: nginx-https
    ports:
      - "80:80"
      - "443:443"
      - "3001:3001"   # Port HTTPS pour a-reference-front
      - "3002:3002"   # Port HTTPS pour gestion-forum-front
      - "3003:3003"   # Port HTTPS pour a-user-front
      - "8080:8080"   # Port HTTPS pour API Gateway (CRITIQUE!)
    volumes:
      - ./nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/certs/nginx-selfsigned.crt:/etc/nginx/ssl/nginx-selfsigned.crt:ro
      - /etc/ssl/private/nginx-selfsigned.key:/etc/nginx/ssl/nginx-selfsigned.key:ro
    networks:
      - pvvih-network
    depends_on:
      - gateway-pvvih
      - a-reference-front
      - a-user-front
      - gestion-forum-front
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ==================== Frontend Services ====================
  
  gestion-forum-front:
    build:
      context: ./gestion_forum_front
      dockerfile: Dockerfile
      args:
        REACT_APP_GATEWAY_URL: ${REACT_APP_GATEWAY_URL}
        REACT_APP_API_URL: ${REACT_APP_API_URL}
        REACT_APP_AUTH_API_URL: ${REACT_APP_AUTH_API_URL}
        REACT_APP_FORUM_API_URL: ${REACT_APP_FORUM_API_URL}
        REACT_APP_FORUM_URL: ${REACT_APP_FORUM_URL}
        REACT_APP_FRONTEND1_URL: ${REACT_APP_FRONTEND1_URL}
        REACT_APP_FRONTEND2_URL: ${REACT_APP_FRONTEND2_URL}
    container_name: gestion-forum-front
    # ports: # Désactivé - accès via Nginx HTTPS
    #   - "3001:80"
    environment:
      - REACT_APP_FORUM_API_URL=${REACT_APP_FORUM_API_URL}
      - REACT_APP_AUTH_API_URL=${REACT_APP_AUTH_API_URL}
      - REACT_APP_GATEWAY_URL=${REACT_APP_GATEWAY_URL}
      - REACT_APP_FRONTEND1_URL=${REACT_APP_FRONTEND1_URL}
      - REACT_APP_FRONTEND2_URL=${REACT_APP_FRONTEND2_URL}
    networks:
      - pvvih-network
    depends_on:
      - gateway-pvvih
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  a-reference-front:
    build:
      context: ./a_reference_front
      dockerfile: Dockerfile
      args:
        REACT_APP_GATEWAY_URL: ${REACT_APP_GATEWAY_URL}
        REACT_APP_API_URL: ${REACT_APP_API_URL}
        REACT_APP_USER_API_URL: ${REACT_APP_USER_API_URL}
        REACT_APP_REFERENCEMENT_API_URL: ${REACT_APP_API_URL}
        REACT_APP_PATIENT_API_URL: ${REACT_APP_API_URL}
        REACT_APP_FORUM_API_URL: ${REACT_APP_FORUM_API_URL}
        REACT_APP_FORUM_URL: ${REACT_APP_FORUM_URL}
        REACT_APP_FRONTEND2_URL: ${REACT_APP_FRONTEND2_URL}
    container_name: a-reference-front
    # ports: # Désactivé - accès via Nginx HTTPS
    #   - "3002:80"
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
      - REACT_APP_GATEWAY_URL=${REACT_APP_GATEWAY_URL}
      - REACT_APP_FORUM_URL=${REACT_APP_FORUM_URL}
      - REACT_APP_FRONTEND2_URL=${REACT_APP_FRONTEND2_URL}
    networks:
      - pvvih-network
    depends_on:
      - gateway-pvvih
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  a-user-front:
    build:
      context: ./a_user_front
      dockerfile: Dockerfile
      args:
        REACT_APP_GATEWAY_URL: ${REACT_APP_GATEWAY_URL}
        REACT_APP_API_URL: ${REACT_APP_API_URL}
        REACT_APP_USER_API_URL: ${REACT_APP_USER_API_URL}
        REACT_APP_FORUM_URL: ${REACT_APP_FORUM_URL}
        REACT_APP_FRONTEND1_URL: ${REACT_APP_FRONTEND1_URL}
        REACT_APP_FRONTEND2_URL: ${REACT_APP_FRONTEND2_URL}
    container_name: a-user-front
    ports: # Exposé pour accès direct HTTP (changé de 3003 à 3013 car 3003 est utilisé par nginx-https)
      - "3013:80"
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
      - REACT_APP_GATEWAY_URL=${REACT_APP_GATEWAY_URL}
      - REACT_APP_USER_API_URL=${REACT_APP_USER_API_URL}
      - REACT_APP_FORUM_URL=${REACT_APP_FORUM_URL}
      - REACT_APP_FRONTEND1_URL=${REACT_APP_FRONTEND1_URL}
    networks:
      - pvvih-network
    depends_on:
      - gateway-pvvih
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
